<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="biopharmTitle biopharmDesc">
  <title id="biopharmTitle">BIOPHARM logo</title>
  <desc id="biopharmDesc">Biopharm wordmark with a blue background, a stylized globe in the O, and the tagline Your Healthcare Partner.</desc>
  <defs>
    <linearGradient id="biopharmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5aa3" />
      <stop offset="100%" stop-color="#115caa" />
    </linearGradient>
    <linearGradient id="biopharmGlobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86d8f7" />
      <stop offset="45%" stop-color="#1fa5d9" />
      <stop offset="100%" stop-color="#0f5aa3" />
    </linearGradient>
    <radialGradient id="biopharmGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#d5f3ff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#d5f3ff" stop-opacity="0" />
    </radialGradient>
    <filter id="biopharmShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#083d74" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="820" height="260" rx="8" fill="url(#biopharmBg)" />

  <g filter="url(#biopharmShadow)">
    <text
      x="44"
      y="148"
      fill="#ffffff"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="82"
      font-weight="700"
      letter-spacing="-1.5"
    >
      BI
    </text>

    <g transform="translate(177 73)">
      <circle cx="41" cy="41" r="39" fill="url(#biopharmGlobe)" stroke="#ffffff" stroke-width="10" />
      <circle cx="31" cy="28" r="24" fill="url(#biopharmGlow)" />
      <ellipse cx="41" cy="41" rx="26" ry="39" fill="none" stroke="#d8f4ff" stroke-width="3.5" opacity="0.9" />
      <ellipse cx="41" cy="41" rx="39" ry="17" fill="none" stroke="#d8f4ff" stroke-width="3.5" opacity="0.9" />
      <path d="M10 41h62M41 7v68" stroke="#d8f4ff" stroke-width="3.5" opacity="0.82" />
      <path d="M18 20c10 8 15 18 15 31s-5 23-15 31" fill="none" stroke="#9be6ff" stroke-width="3" opacity="0.8" />
      <path d="M64 20c-10 8-15 18-15 31s5 23 15 31" fill="none" stroke="#9be6ff" stroke-width="3" opacity="0.8" />
      <path d="M17 66c16 3 33 3 49 0" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.92" />
    </g>

    <text
      x="271"
      y="148"
      fill="#ffffff"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="82"
      font-weight="700"
      letter-spacing="-1.5"
    >
      PHARM
    </text>

    <text
      x="224"
      y="201"
      fill="#ffffff"
      font-family="'Trebuchet MS', Arial, sans-serif"
      font-size="30"
      letter-spacing="1.2"
    >
      Your Healthcare Partner
    </text>
  </g>
</svg>
